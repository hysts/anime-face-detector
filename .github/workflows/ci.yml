name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --only-group dev
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Cache pretrained checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: checkpoints-v0.0.1
      # CPU wheels keep the environment small enough for hosted runners;
      # this intentionally bypasses uv.lock for the torch packages only.
      - run: uv venv
      - run: uv pip install --torch-backend=cpu -e . --group dev
      - run: uv run --no-sync pytest tests/
